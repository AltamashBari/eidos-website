<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>EIDOS Design Studio</title>
  <!-- Charcoal Black #222222 ground, EIDOS Orange #F98111 mark.
       The E is drawn as rectangles rather than text so it renders
       identically everywhere, with no webfont dependency. Squared
       terminals echo the blocky construction of the EIDOS wordmark. -->
  <rect width="64" height="64" rx="13" fill="#222222"/>
  <g fill="#F98111">
    <rect x="18" y="14" width="9.5" height="36"/>
    <rect x="18" y="14" width="28" height="9.5"/>
    <rect x="18" y="27.25" width="21.5" height="9.5"/>
    <rect x="18" y="40.5" width="28" height="9.5"/>
  </g>
</svg>
